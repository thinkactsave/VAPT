
env:
  contexts:
    - name: "ProofVAPT-Scope"
      urls:
        - "http://localhost:3000"
      includePaths:
        - "http://localhost:3000.*"
      excludePaths:
        - ".*/logout.*"
  parameters:
    failOnError: false
    progressToStdout: false
jobs:
  - type: spider
    parameters:
      context: "ProofVAPT-Scope"
      user: ""
      url: "http://localhost:3000"
      maxDuration: 1
      maxDepth: 3
  - type: passiveScan-wait
    parameters:
      maxDuration: 1
  
  - type: activeScan
    parameters:
      context: "ProofVAPT-Scope"
      url: "http://localhost:3000"
      maxDuration: 2
  
  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/app/applet/.data/artifacts"
      reportFile: "scan-1792692668461-zqgbx_zap_report.json"
