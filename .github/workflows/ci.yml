name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Run policy and benchmark tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  container-image:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build production container
        run: docker build --pull --tag proofvapt:ci .
      - name: Validate Compose deployment configuration
        env:
          PROOFVAPT_API_TOKEN: ci-only-validation-token-not-a-real-secret
        run: docker compose config --quiet
