name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Run policy and benchmark tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  container-image:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build production container
        run: docker build --pull --tag proofvapt:ci .
      - name: Validate Compose deployment configuration
        env:
          PROOFVAPT_API_TOKEN: ci-only-validation-token-not-a-real-secret
        run: docker compose config --quiet
      - name: Smoke-test the production container
        env:
          PROOFVAPT_API_TOKEN: ci-only-token-for-automated-smoke-test-123456789
        run: |
          set -eu
          docker run -d --name proofvapt-smoke \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=768m,mode=1777 \
            --tmpfs /data:rw,nosuid,size=100m,uid=1000,gid=1000,mode=0750 \
            --cap-drop=ALL \
            --security-opt no-new-privileges:true \
            --pids-limit=256 \
            --memory=2g \
            --cpus=2 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e PROOFVAPT_API_TOKEN="$PROOFVAPT_API_TOKEN" \
            -e PROOFVAPT_DATA_DIR=/data \
            -p 127.0.0.1:39000:3000 \
            proofvapt:ci
          trap 'docker rm -f proofvapt-smoke >/dev/null 2>&1 || true' EXIT

          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:39000/api/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            docker logs proofvapt-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:39000/ >/dev/null

          unauth_status=$(curl -sS -o /tmp/proofvapt-unauth.json -w '%{http_code}' http://127.0.0.1:39000/api/scans)
          test "$unauth_status" = "401"
          curl -fsS -H "Authorization: Bearer $PROOFVAPT_API_TOKEN" http://127.0.0.1:39000/api/scans >/dev/null
