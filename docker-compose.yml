services:
  proofvapt:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      # Bind to loopback. Put a TLS reverse proxy in front for remote access.
      - "127.0.0.1:${APP_BIND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      PROOFVAPT_API_TOKEN: ${PROOFVAPT_API_TOKEN:?Copy .env.example to .env and set a random PROOFVAPT_API_TOKEN}
      PROOFVAPT_DATA_DIR: /data
      JUICE_SHOP_URL: http://juice-shop:3000
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx768m"
    volumes:
      - proofvapt-data:/data
    depends_on:
      juice-shop:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Intentionally not published to the host; only the ProofVAPT container
  # can reach this vulnerable training application on the Compose network.
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  proofvapt-data:
